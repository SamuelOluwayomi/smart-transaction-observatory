[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Yellowstone gRPC
yellowstone-grpc-client = "1.13.0"
yellowstone-grpc-proto = "1.13.0"

# Solana
solana-sdk = "2.2"
solana-client = "2.2"
solana-rpc-client = "2.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variables
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket server
tokio-tungstenite = "0.21"
futures-util = "0.3"
futures = "0.3"

# gRPC
tonic = "0.10"

# Error handling
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }