[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc.git", tag = "v12.1.0+solana.3.1.9" }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc.git", tag = "v12.1.0+solana.3.1.9" }
solana-sdk = "^2.1"
solana-rpc-client = "^2.1"
solana-rpc-client-api = "^2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
futures = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-webpki-roots"] }
rand = "0.8"
bincode = "1"
